# ~/devtools/lima/isengard.yaml — multi-purpose arm64 Ubuntu 22.04 build box
# (Ubuntu 22.04 for Yocto toolchain compatibility.)
#
# Usage:
#   limactl start ~/devtools/lima/isengard.yaml   # first-time create
#   limactl start isengard                        # start existing
#   limactl stop isengard                         # stop
#   limactl shell isengard                        # enter  (ssh: lima-isengard)
#
# After first login, symlink the host mount into your home:
#   ln -s /mnt/hostfs ~/hostfs

vmType: "vz"
vmOpts:
  vz:
    rosetta:
      enabled: true      # run x86_64 binaries inside the arm64 guest
      binfmt: true

# Host username `hamilton.little` is invalid on Linux (no dots allowed),
# so set a dotless guest user explicitly — otherwise Lima falls back to `lima`.
user:
  name: "hamilton"

images:
  - location: "https://cloud-images.ubuntu.com/releases/22.04/release/ubuntu-22.04-server-cloudimg-arm64.img"
    arch: "aarch64"

# tuned for an 18-core / 48 GB Mac: leaves 6 cores + 16 GB for macOS
cpus: 12
memory: "32GiB"
disk: "500GiB"           # single combined root + build disk, thin-provisioned

mountType: "virtiofs"
mounts:
  - location: "~"              # whole Mac home
    mountPoint: "/mnt/hostfs"  # neutral path; symlink to ~/hostfs inside the box
    writable: true

# Minimal prerequisites so ./bootstrap.sh can run on a fresh box:
#   - build-essential: cargo needs a C toolchain (`cc`) to compile `just`
#   - python3-venv/pip: `just init` builds the ansible venv
# The setup-dev playbook still does the actual environment setup.
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y build-essential git curl python3-venv python3-pip

# ~/devtools/lima/isengard.yaml — multi-purpose arm64 Ubuntu 22.04 build box
# (Ubuntu 22.04 for Yocto toolchain compatibility.)
#
# Usage:
#   limactl start ~/devtools/lima/isengard.yaml   # first-time create
#   limactl start isengard                        # start existing
#   limactl stop isengard                         # stop
#   limactl shell isengard                        # enter  (ssh: lima-isengard)
#
# After first login, symlink the host mount into your home:
#   ln -s /mnt/hostfs ~/hostfs

vmType: "vz"
vmOpts:
  vz:
    rosetta:
      enabled: true      # run x86_64 binaries inside the arm64 guest
      binfmt: true

# Host username `hamilton.little` is invalid on Linux (no dots allowed),
# so set a dotless guest user explicitly — otherwise Lima falls back to `lima`.
user:
  name: "hamilton"

images:
  - location: "https://cloud-images.ubuntu.com/releases/22.04/release/ubuntu-22.04-server-cloudimg-arm64.img"
    arch: "aarch64"

# tuned for an 18-core / 48 GB Mac: leaves 4 cores + 16 GB for macOS
cpus: 14
memory: "32GiB"
disk: "500GiB"           # single combined root + build disk, thin-provisioned

# Forward the host SSH agent into the guest so your Mac key works for git/etc.
ssh:
  forwardAgent: true

# Shared vmnet via socket_vmnet: host-reachable IP on 192.168.105.0/24.
# We use this over vzNAT because vzNAT's fixed 192.168.64.0/24 collides with
# the corp VPN (utun4 routes that subnet into the tunnel), making the guest
# unreachable there. socket_vmnet lets us pick a non-conflicting subnet.
# metric 300 keeps eth0 (usernet, metric 200) as the default route.
# Host setup: brew install socket_vmnet && limactl sudoers | sudo tee /etc/sudoers.d/lima
networks:
  - lima: shared
    metric: 300

mountType: "virtiofs"
mounts:
  - location: "~"              # whole Mac home
    mountPoint: "/mnt/hostfs"  # neutral path; symlink to ~/hostfs inside the box
    writable: true

# Minimal prerequisites so ./bootstrap.sh can run on a fresh box:
#   - build-essential: cargo needs a C toolchain (`cc`) to compile `just`
#   - python3-venv/pip: `just init` builds the ansible venv
#   - qemu-user-static: run 32-bit x86 tegra tools (e.g. mkbootimg) that
#     Rosetta (x86_64-only) can't execute; required for the Jetson Yocto build
# The setup-dev playbook still does the actual environment setup.
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y build-essential git curl python3-venv python3-pip qemu-user-static

  # 16 GiB swapfile so memory-hungry recipes (webkitgtk at high -j) can spill
  # over the 32 GiB RAM cap instead of getting OOM-killed. Swap is disk-backed
  # (slow/thrashy) but only bites during the one-time webkit compile; sstate
  # skips it thereafter. Lives on the guest disk, so it never touches the Mac's
  # RAM budget.
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      if [ ! -f /swapfile ]; then
        fallocate -l 16G /swapfile
        chmod 600 /swapfile
        mkswap /swapfile
        grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
      fi
      swapon --show | grep -q '/swapfile' || swapon /swapfile
